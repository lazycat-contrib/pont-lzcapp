application:
  subdomain: pont
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://host.lzcapp:13333/
services:
  pont:
    # ghcr.io/dockers-x/pont:v0.2.1
    # upstream: ghcr.io/dockers-x/pont:v0.2.1
    image: registry.lazycat.cloud/czyt/dockers-x/pont:cd58ec4fd4cd4dac
    network_mode: host
    user: root
    environment:
      - PORT=13333
      - TZ=CST
    binds:
      - /lzcapp/var/data:/app/data
      - /lzcapp/var/logs:/app/logs
